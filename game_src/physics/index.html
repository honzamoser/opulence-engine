<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testovací scéna</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="main" style="
                width: 100%;
                height: 100%;
                display: block;
                pointer-events: none;
            ">
    </canvas>

    <script src="render_test.ts" type="module" defer></script>

    <div style="position: fixed; top: 10px; left: 10px; color: white; font-family: sans-serif; pointer-events: none; display: flex; flex-direction: column;">
        <input id="gravitySlider" type="range" id="gravitySlider" min="-10" max="10" step="0.1" value="9.81"
            style="pointer-events: auto;">
        <label for="gravitySlider">Gravity: <span id="gravityValue">9.81</span></label>

        <input type="color" id="cubeColor" style="pointer-events: auto;">
        <label for="cubeColor">Cube Color</label>
    </div>

    <script>
        const gravitySlider = document.getElementById("gravitySlider");
        const gravityValue = document.getElementById("gravityValue");

        const cubeColorInput = document.getElementById("cubeColor");

        console.log(gravitySlider, gravityValue);

        gravitySlider.addEventListener("input", (e) => {
            console.log("Gravity slider value:", e.target.value);
            const gravity = parseFloat(e.target.value);
            window.plug.gravity = gravity;
            gravityValue.textContent = gravity.toFixed(2);
        });

        cubeColorInput.addEventListener("input", (e) => {
            const color = e.target.value;
            window.plug.changeColor(0, new Float32Array([
                parseInt(color.slice(1, 3), 16) / 255,
                parseInt(color.slice(3, 5), 16) / 255,
                parseInt(color.slice(5, 7), 16) / 255,
                1.0
            ]));
        });
    </script>

</body>

</html>
